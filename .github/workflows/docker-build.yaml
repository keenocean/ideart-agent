name: Build and Push Docker Image

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SVR_NAME: ${{ github.event.repository.name }}

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-auth-secret-change-in-production
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:data/ci.db
      VITE_APP_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Compile Paraglide runtime
        run: pnpm i18n:compile

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Check marketing assets
        run: pnpm marketing:check-assets

      - name: Check route bundles
        run: pnpm bundle:report-routes

      - name: Check Cloudflare dry-run budget
        run: pnpm cf:check-budget

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality-gates
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env.production
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        if: ${{ env.ENV_PRODUCTION != '' }}
        run: echo "$ENV_PRODUCTION" > .env.production

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
