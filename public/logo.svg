<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Image Agent">
  <defs>
    <linearGradient id="image-agent-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d846"/>
      <stop offset="1" stop-color="#e4af00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#image-agent-bg)"/>
  <!-- Frame plus spark: the image and the agent. The spark carries a stroke
       in the background colour so the two shapes stay legibly apart instead
       of merging into one blob at small sizes. -->
  <rect x="96" y="152" width="232" height="232" rx="48" fill="none" stroke="#241f08" stroke-width="34"/>
  <path d="M362 96c12 66 40 94 106 106-66 12-94 40-106 106-12-66-40-94-106-106 66-12 94-40 106-106z"
        fill="#241f08" stroke="url(#image-agent-bg)" stroke-width="30" stroke-linejoin="round" paint-order="stroke"/>
</svg>
